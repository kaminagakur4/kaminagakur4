name: Atualizar cards do README

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Um arquivo por card, não dois: duas versões exigiriam <picture>, e dentro dele
# o <img> tem de ser filho direto, o que impede envolvê-lo num link. Sem link, o
# GitHub abre o SVG numa aba nova ao clicar. Daí a cor única 7A7A85, o melhor
# pior-caso de contraste medido (4.24 no tema claro, 4.46 no escuro).
env:
  COR: title_color=7A7A85&text_color=7A7A85&bg_color=00000000&hide_border=true

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # O README não pode apontar para raw.githubusercontent.com: o GitHub não
      # proxia pelo camo o que já é do domínio dele, então o navegador de quem
      # visita busca o raw direto e leva 429 por IP. Foi o que apagou os quinze
      # ícones e o card de linguagens em 17/08/2026. Caminho relativo conta como
      # raw: o GitHub o reescreve para lá. Tudo passa pelo jsdelivr.
      # Olha só os src, nunca o arquivo todo: o próprio README explica em comentário
      # por que o raw não serve, e varrer o texto reprovaria a explicação.
      - name: Guarda das imagens
        run: |
          srcs=$(grep -o 'src="[^"]*"' README.md)
          echo "$srcs" | grep -c . | xargs -I{} echo "src encontrados: {}"
          test "$(echo "$srcs" | grep -c .)" -ge 17 || {
            echo "::error::menos src do que o esperado; a varredura não está vendo o README"
            exit 1
          }
          if echo "$srcs" | grep 'raw\.githubusercontent\.com'; then
            echo "::error::src aponta para raw.githubusercontent.com; use cdn.jsdelivr.net"
            exit 1
          fi
          if echo "$srcs" | grep -E 'src="\.?/'; then
            echo "::error::src relativo; o GitHub o reescreve para o raw"
            exit 1
          fi

      # GRS_TOKEN (PAT) conta repositórios privados; sem ele o card só vê os públicos.
      - name: Linguagens
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2.0.2
        with:
          card: top-langs
          path: profile/langs.svg
          token: ${{ secrets.GRS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: "true"
          options: layout=compact&langs_count=8&card_width=340&${{ env.COR }}

      # Fora do README hoje, gerado para voltar em uma colagem.
      - name: Estatísticas
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2.0.2
        with:
          card: stats
          path: profile/stats.svg
          token: ${{ secrets.GRS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: "true"
          options: show_icons=true&include_all_commits=true&icon_color=557EE5&ring_color=557EE5&${{ env.COR }}

      - name: Comitar
        run: |
          # Endereço noreply, não o pessoal: este arquivo é público e e-mail
          # em texto puro vira alvo de raspagem. O GitHub atribui igual.
          git config user.name kaminagakur4
          git config user.email 277797585+kaminagakur4@users.noreply.github.com
          git add profile/*.svg
          git diff --cached --quiet || git commit -m "chore: atualiza cards do README"
          git push

      # O jsdelivr guarda ref de branch por até 12h, então sem purgar o card novo
      # só apareceria no dia seguinte. Falha aqui não derruba o job: o commit já
      # está feito e o pior caso é o cache expirar sozinho.
      - name: Purgar o cache do jsdelivr
        continue-on-error: true
        run: |
          for f in langs stats; do
            curl -sS -o /dev/null -w "$f: %{http_code}\n" \
              "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/profile/$f.svg"
          done
