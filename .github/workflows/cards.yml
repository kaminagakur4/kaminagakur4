name: Atualizar cards do README

on:
  schedule:
    # A cada 6h, não uma vez ao dia. Um card de SEQUÊNCIA precisa dizer HOJE, e
    # com uma rodada só, às 06:00 UTC (03:00 em São Paulo), ele passava o dia
    # inteiro mostrando ontem: em 17/08/2026 a tela dizia "18 de jun. - 16 de
    # ago." num dia 17. Este cron é o único botão de frequência.
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Um arquivo por card, não dois: duas versões exigiriam <picture>, e dentro dele
# o <img> tem de ser filho direto, o que impede envolvê-lo num link. Sem link, o
# GitHub abre o SVG numa aba nova ao clicar. Daí a cor única 7A7A85, o melhor
# pior-caso de contraste medido (4.24 no tema claro, 4.46 no escuro).
env:
  COR: title_color=7A7A85&text_color=7A7A85&bg_color=00000000&hide_border=true

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reprova host que calcula imagem por requisição, raw.githubusercontent,
      # caminho relativo e pino faltando. O porquê de cada regra está no
      # cabeçalho do script.
      - name: Guarda das imagens
        run: python3 scripts/pin-cards.py --verificar

      # GRS_TOKEN (PAT) conta repositórios privados; sem ele o card só vê os públicos.
      - name: Linguagens
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2.0.2
        with:
          card: top-langs
          path: profile/langs.svg
          token: ${{ secrets.GRS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: "true"
          options: layout=compact&langs_count=8&card_width=340&locale=pt-br&${{ env.COR }}

      # Fora do README hoje, gerado para voltar em uma colagem.
      - name: Estatísticas
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2.0.2
        with:
          card: stats
          path: profile/stats.svg
          token: ${{ secrets.GRS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: "true"
          options: show_icons=true&include_all_commits=true&locale=pt-br&icon_color=557EE5&ring_color=557EE5&${{ env.COR }}

      # A sequência era o único card de serviço externo e quebrou duas vezes em
      # dois dias; agora é arquivo nosso, como os outros. continue-on-error de
      # propósito: se a API não responder, o SVG anterior continua no repo e na
      # tela. Dado velho é aceitável, buraco na página não é.
      - name: Sequência
        id: sequencia
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GRS_TOKEN || secrets.GITHUB_TOKEN }}
        run: python3 scripts/gerar-sequencia.py

      - name: Comitar os cards
        id: cards
        run: |
          # Endereço noreply, não o pessoal: este arquivo é público e e-mail
          # em texto puro vira alvo de raspagem. O GitHub atribui igual.
          git config user.name kaminagakur4
          git config user.email 277797585+kaminagakur4@users.noreply.github.com

          git add profile/*.svg
          if git diff --cached --quiet; then
            echo "Nada mudou em nenhum card. Sem commit, sem pino novo."
            echo "sha=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: atualiza cards do README"
          git push
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # NUNCA fixar o README numa URL que o jsdelivr ainda não serve. Se o camo
      # buscar nessa janela, ele guarda a falha e o card some da página: foi
      # medido em 17/08/2026 com um passo de purge que se tentou e se removeu.
      # Aquecer é um GET, não invalida nada, e é a ordem certa.
      - name: Aquecer o jsdelivr
        if: steps.cards.outputs.sha != ''
        run: |
          falhou=0
          for f in langs stats sequencia; do
            url="https://cdn.jsdelivr.net/gh/${{ github.repository }}@${{ steps.cards.outputs.sha }}/profile/$f.svg"
            quente=0
            for t in 1 2 3 4 5 6 7 8; do
              c=$(curl -s -o /dev/null -w '%{http_code}' "$url")
              if [ "$c" = 200 ]; then
                echo "$f: quente na tentativa $t"
                quente=1
                break
              fi
              echo "$f: tentativa $t devolveu $c"
              sleep 10
            done
            if [ "$quente" = 0 ]; then
              falhou=1
            fi
          done
          if [ "$falhou" = 1 ]; then
            echo "::error::jsdelivr não aqueceu; o README fica no pino anterior, que funciona"
            exit 1
          fi

      # O endereço muda a cada commit de card, e é isso que obriga o camo a
      # buscar de novo. Sem esta troca o cache dele mostraria o card de ontem.
      - name: Fixar o README no commit dos cards
        if: steps.cards.outputs.sha != ''
        run: |
          python3 scripts/pin-cards.py --fixar "${{ steps.cards.outputs.sha }}"
          git add README.md
          if git diff --cached --quiet; then
            echo "README já estava no pino certo."
          else
            curto=$(echo "${{ steps.cards.outputs.sha }}" | cut -c1-7)
            git commit -m "chore: fixa os cards no commit $curto"
            git push
          fi
